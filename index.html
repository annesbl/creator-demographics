  :root {
    --ink: #02010a;
    --ink-secondary: #6b6880;
    --ink-muted: #908da0;
    --surface: #ffffff;
    --surface-alt: #f5f4f6;
    --surface-raised: #ffffff;
    --border: #e5e3ea;
    --accent: #6029cd;
    --accent-strong: #4d21a4;
    --accent-soft: #e8e1f5;
    --highlight: #d0ff4a;
    --shadow: 0 2px 16px rgba(30, 16, 60, 0.06);
    --shadow-lg: 0 12px 40px rgba(30, 16, 60, 0.12);

    --cat-1: #6029cd;
    --cat-2: #8b5cf6;
    --cat-3: #d0ff4a;
    --cat-4: #4d21a4;
    --cat-5: #a78bdb;
    --cat-6: #261052;
    --cat-7: #9b96a8;

    --font-display: 'F37Sonic', 'Arial Black', Impact, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ink: #f2f0f7;
      --ink-secondary: #bdb8cf;
      --ink-muted: #8d87a3;
      --surface: #150c29;
      --surface-alt: #1c1236;
      --surface-raised: #1f1440;
      --border: #362a54;
      --accent: #a389f0;
      --accent-strong: #c6b3f7;
      --accent-soft: #2c1f52;
      --highlight: #d0ff4a;
      --shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme='dark'] {
    --ink: #f2f0f7;
    --ink-secondary: #bdb8cf;
    --ink-muted: #8d87a3;
    --surface: #150c29;
    --surface-alt: #1c1236;
    --surface-raised: #1f1440;
    --border: #362a54;
    --accent: #a389f0;
    --accent-strong: #c6b3f7;
    --accent-soft: #2c1f52;
    --highlight: #d0ff4a;
    --shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.45);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--surface-alt);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding: 28px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---------- header ---------- */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px 40px;
    flex-wrap: wrap;
  }

  .topbar__brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .brand-mark svg {
    width: 22px;
    height: 22px;
  }

  .topbar__title h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(22px, 2.6vw, 30px);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .topbar__title p {
    margin: 3px 0 0;
    color: var(--ink-secondary);
    font-size: 13px;
    max-width: 56ch;
  }

  .topbar__meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .updated-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    padding: 0 13px;
    border-radius: 9999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink-secondary);
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
  }

  .updated-pill__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }

  .source-note {
    font-size: 11.5px;
    color: var(--ink-muted);
  }

  /* ---------- stat tiles ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .stat__label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .stat__value {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .stat__sub {
    font-size: 12px;
    color: var(--ink-secondary);
  }

  /* ---------- controls ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 20px 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px 24px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-group__label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);

  const DIMENSIONS = [
    { key: 'a', label: 'Altersgruppe', order: ['< 18', '18-24', '25-34', '35-44', '45-54', '55+', 'Unbekannt'] },
    { key: 'g', label: 'Geschlecht', order: ['female', 'male', 'diverse', 'Unbekannt'] },
    { key: 'c', label: 'Land', order: ['Deutschland', 'Italien', 'Niederlande', 'UK/Englischsprachig', 'Frankreich', 'Unbekannt'] },
  ];

  const LABELS = {
    'female': 'Weiblich', 'male': 'Männlich', 'diverse': 'Divers', 'Unbekannt': 'Unbekannt',
  };

  const PALETTE = ['var(--cat-1)', 'var(--cat-2)', 'var(--cat-3)', 'var(--cat-4)', 'var(--cat-5)', 'var(--cat-6)', 'var(--cat-7)'];

  const state = {
    dimension: 'a',
    countries: new Set(),
    hiddenSeries: new Set(),
    donutMonths: new Set(),
  };

  let ALL_COUNTRIES = [];
  let ALL_MONTHS = [];
  let ALL_YEARS = [];

  function rebuildDerived() {
    ALL_COUNTRIES = [...new Set(RAW.map((r) => r.c))].sort();
    ALL_MONTHS = [...new Set(RAW.map((r) => r.m))].sort();
    ALL_YEARS = [...new Set(ALL_MONTHS.map((m) => m.split('-')[0]))].sort();
    state.calYear = parseInt(ALL_MONTHS[ALL_MONTHS.length - 1].split('-')[0], 10);
    state.donutMonths = new Set();
  }
  rebuildDerived();

  function fmtInt(n) {
    return new Intl.NumberFormat('de-DE').format(Math.round(n));
  }

  function monthLabel(m) {
    const [y, mo] = m.split('-');
    const names = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
    return `${names[parseInt(mo, 10) - 1]} ${y.slice(2)}`;
  }

  function seriesLabel(key, value) {
    return LABELS[value] || value;
  }

  function colorFor(dimKey, value) {
    const order = DIMENSIONS.find((d) => d.key === dimKey).order;
    const idx = order.indexOf(value);
    return PALETTE[(idx >= 0 ? idx : order.length) % PALETTE.length];
  }

  function filteredRows() {
    if (state.countries.size === 0) return RAW;
    return RAW.filter((r) => state.countries.has(r.c));
  }

  function buildModel() {
    const rows = filteredRows();
    const dim = DIMENSIONS.find((d) => d.key === state.dimension);
    const values = new Set(rows.map((r) => r[state.dimension]));
    const series = dim.order
      .filter((v) => values.has(v))
      .map((v) => ({ key: v, label: seriesLabel(state.dimension, v), color: colorFor(state.dimension, v) }));

    const byMonth = new Map(ALL_MONTHS.map((m) => [m, { period: m, total: 0 }]));
    rows.forEach((r) => {
      const bucket = byMonth.get(r.m);
      const val = bucket[r[state.dimension]] || 0;
      bucket[r[state.dimension]] = val + r.n;
      bucket.total += r.n;
    });

    let monthRows = ALL_MONTHS.map((m) => byMonth.get(m));
    monthRows = monthRows.filter((r) => r.total > 0);

    return { rows: monthRows, series };
  }

  function renderStats(model) {
    const rows = filteredRows();
    const total = rows.reduce((s, r) => s + r.n, 0);
    const monthsCovered = new Set(rows.map((r) => r.m)).size;
    const avgPerMonth = monthsCovered ? total / monthsCovered : 0;

    const byCountry = new Map();
    rows.forEach((r) => byCountry.set(r.c, (byCountry.get(r.c) || 0) + r.n));
    const topCountry = [...byCountry.entries()].sort((a, b) => b[1] - a[1])[0];

    const latestMonth = model.rows.length ? model.rows[model.rows.length - 1] : null;
    const latestTotal = latestMonth ? latestMonth.total : 0;

    const stats = [
      { label: 'Creator gesamt', value: fmtInt(total), sub: `${monthsCovered} Monate erfasst` },
      { label: 'Ø pro Monat', value: fmtInt(avgPerMonth), sub: 'im gefilterten Zeitraum' },
      {
        label: 'Letzter Monat',
        value: fmtInt(latestTotal),
        sub: latestMonth ? monthLabel(latestMonth.period) : '–',
      },
      { label: 'Stärkstes Land', value: topCountry ? topCountry[0] : '–', sub: topCountry ? `${fmtInt(topCountry[1])} Creator` : '' },
    ];

    document.getElementById('stats').innerHTML = stats
      .map(
        (s) => `<div class="stat"><span class="stat__label">${s.label}</span><span class="stat__value">${s.value}</span><span class="stat__sub">${s.sub}</span></div>`
      )
      .join('');
  }

  function renderControls() {
    const dimSwitch = document.getElementById('dimensionSwitch');
    dimSwitch.innerHTML = DIMENSIONS.map(
      (d) => `<button data-dim="${d.key}" class="${d.key === state.dimension ? 'active' : ''}">${d.label}</button>`
    ).join('');
    dimSwitch.querySelectorAll('button').forEach((btn) =>
      btn.addEventListener('click', () => {
        state.dimension = btn.dataset.dim;
        state.hiddenSeries.clear();
        renderAll();
      })
    );

    const countryFilter = document.getElementById('countryFilter');
    const allActive = state.countries.size === 0;
    countryFilter.innerHTML =
      `<button class="chip ${allActive ? 'active' : ''}" data-country="__all__">Alle</button>` +
      ALL_COUNTRIES.map(
        (c) => `<button class="chip ${state.countries.has(c) ? 'active' : ''}" data-country="${c}">${c}</button>`
      ).join('');
    countryFilter.querySelectorAll('button').forEach((btn) =>
      btn.addEventListener('click', () => {
        const c = btn.dataset.country;
        if (c === '__all__') {
          state.countries.clear();
        } else if (state.countries.has(c)) {
          state.countries.delete(c);
        } else {
          state.countries.add(c);
        }
        renderAll();
      })
    );
  }

  const NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  const barTooltip = document.getElementById('barTooltip');
  const pieTooltip = document.getElementById('pieTooltip');

  function showTooltip(el, x, y, html) {
    el.innerHTML = html;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.classList.add('visible');
  }
  function hideTooltip(el) {
    el.classList.remove('visible');
  }

  function renderBarChart(model) {
    const svg = document.getElementById('barChart');
    svg.innerHTML = '';

    const rows = model.rows;
    const series = model.series.filter((s) => !state.hiddenSeries.has(s.key));
    const barW = 22;
    const gap = 14;
    const leftPad = 46;
    const rightPad = 16;
    const topPad = 14;
    const bottomPad = 30;
    const chartH = 300;
    const width = Math.max(leftPad + rightPad + rows.length * (barW + gap), 600);
    svg.setAttribute('width', width);
    svg.setAttribute('height', chartH + topPad + bottomPad);
    svg.setAttribute('viewBox', `0 0 ${width} ${chartH + topPad + bottomPad}`);

    const maxVal = Math.max(1, ...rows.map((r) => series.reduce((s, ser) => s + (r[ser.key] || 0), 0)));
    const niceMax = maxVal <= 10 ? maxVal + 2 : Math.ceil(maxVal / Math.pow(10, Math.floor(Math.log10(maxVal)))) * Math.pow(10, Math.floor(Math.log10(maxVal)));

    const yScale = (v) => chartH - (v / niceMax) * chartH;

    const gridCount = 4;
    for (let i = 0; i <= gridCount; i++) {
      const v = (niceMax / gridCount) * i;
      const y = topPad + yScale(v);
      svg.appendChild(svgEl('line', { x1: leftPad, x2: width - rightPad, y1: y, y2: y, class: 'grid-line' }));
      const label = svgEl('text', { x: leftPad - 8, y: y + 3, class: 'axis-label', 'text-anchor': 'end' });
      label.textContent = fmtInt(v);
      svg.appendChild(label);
    }

    rows.forEach((r, i) => {
      const x = leftPad + i * (barW + gap);
      let yCursor = chartH;
      series.forEach((s) => {
        const val = r[s.key] || 0;
        if (val <= 0) return;
        const h = (val / niceMax) * chartH;
        const y = yCursor - h;
        const rect = svgEl('rect', {
          x,
          y: topPad + y,
          width: barW,
          height: Math.max(h, 0),
          fill: s.color,
          rx: 3,
          class: 'seg',
        });
        rect.addEventListener('mouseenter', (e) => {
          const pct = r.total > 0 ? Math.round((val / r.total) * 1000) / 10 : 0;
          showTooltip(
            barTooltip,
            e.clientX,
            e.clientY,
            `<div class="tt-title">${monthLabel(r.period)}</div><div class="tt-row"><span class="tt-swatch" style="background:${s.color}"></span>${s.label}: <b>${fmtInt(val)}</b> (${pct}%)</div>`
          );
        });
        rect.addEventListener('mousemove', (e) => {
          barTooltip.style.left = e.clientX + 'px';
          barTooltip.style.top = e.clientY + 'px';
        });
        rect.addEventListener('mouseleave', () => hideTooltip(barTooltip));
        svg.appendChild(rect);
        yCursor = y;
      });

      if (i % Math.ceil(rows.length / 24 || 1) === 0 || rows.length < 20) {
        const label = svgEl('text', {
          x: x + barW / 2,
          y: topPad + chartH + 18,
          class: 'axis-label',
          'text-anchor': 'middle',
        });
        label.textContent = monthLabel(r.period);
        svg.appendChild(label);
      }
    });
  }

    const dimLabel = DIMENSIONS.find((d) => d.key === state.dimension).label;
    const periodSuffix =
      state.donutMonths.size === 1
        ? ` · ${monthLabel([...state.donutMonths][0])}`
        : state.donutMonths.size > 1
        ? ` · ${state.donutMonths.size} Monate`
        : '';
    document.getElementById('pieTitle').textContent = `Verteilung nach ${dimLabel}${periodSuffix}`;

    renderLegend(allTotals, grandTotal);

    if (total === 0) {
      const t = svgEl('text', { x: cx, y: cy, 'text-anchor': 'middle', class: 'axis-label' });
      t.textContent = 'Keine Daten';
      svg.appendChild(t);
      return;
    }

    let angle = -Math.PI / 2;
    const gapAngle = 0.012;

    totals.forEach((d) => {
      const frac = d.value / total;
      const sweep = frac * (Math.PI * 2) - gapAngle;
      const a0 = angle;
      const a1 = angle + Math.max(sweep, 0);

      const large = a1 - a0 > Math.PI ? 1 : 0;
      const x0o = cx + rOuter * Math.cos(a0);
      const y0o = cy + rOuter * Math.sin(a0);
      const x1o = cx + rOuter * Math.cos(a1);
      const y1o = cy + rOuter * Math.sin(a1);
      const x0i = cx + rInner * Math.cos(a1);
      const y0i = cy + rInner * Math.sin(a1);
      const x1i = cx + rInner * Math.cos(a0);
      const y1i = cy + rInner * Math.sin(a0);

      const path = svgEl('path', {
        d: `M ${x0o} ${y0o} A ${rOuter} ${rOuter} 0 ${large} 1 ${x1o} ${y1o} L ${x0i} ${y0i} A ${rInner} ${rInner} 0 ${large} 0 ${x1i} ${y1i} Z`,
        fill: d.color,
        class: 'seg',
      });

      const pct = Math.round(frac * 1000) / 10;
      path.addEventListener('mouseenter', (e) => {
        showTooltip(
          pieTooltip,
          e.clientX,
          e.clientY,
          `<div class="tt-title">${d.label}</div><div class="tt-row"><span class="tt-swatch" style="background:${d.color}"></span><b>${fmtInt(d.value)}</b> (${pct}%)</div>`
        );
      });
      path.addEventListener('mousemove', (e) => {
        pieTooltip.style.left = e.clientX + 'px';
        pieTooltip.style.top = e.clientY + 'px';
      });
      path.addEventListener('mouseleave', () => hideTooltip(pieTooltip));
      path.addEventListener('click', () => toggleSeries(d.key));

      svg.appendChild(path);
      angle += frac * (Math.PI * 2);
    });
  }

  function toggleSeries(key) {
    if (state.hiddenSeries.has(key)) state.hiddenSeries.delete(key);
    else state.hiddenSeries.add(key);
    renderAll();
  }

  function renderLegend(totals, grandTotal) {
    const legend = document.getElementById('legend');
    if (!totals.length) {
      legend.innerHTML = '';
      return;
    }
    legend.innerHTML = totals
      .map((d) => {
        const pct = grandTotal ? Math.round((d.value / grandTotal) * 1000) / 10 : 0;
        const dim = d.hidden ? 'style="opacity:.4"' : '';
        return `<div class="legend__row" data-key="${d.key}" ${dim} title="Klicken zum Ein-/Ausblenden">
          <span class="legend__left"><span class="legend__swatch" style="background:${d.color}"></span><span class="legend__name">${d.label}</span></span>
          <span class="legend__val">${fmtInt(d.value)} · ${pct}%</span>
        </div>`;
      })
      .join('');
    legend.querySelectorAll('.legend__row').forEach((row) =>
      row.addEventListener('click', () => toggleSeries(row.dataset.key))
    );
  }

  let currentModel = null;

  function renderCalendar() {
    const yearLabel = document.getElementById('calYearLabel');
    const grid = document.getElementById('calGrid');
    const prevBtn = document.getElementById('calPrev');
    const nextBtn = document.getElementById('calNext');
    const resetBtn = document.getElementById('calReset');

    yearLabel.textContent = state.calYear;
    const minYear = parseInt(ALL_YEARS[0], 10);
    const maxYear = parseInt(ALL_YEARS[ALL_YEARS.length - 1], 10);
    prevBtn.disabled = state.calYear <= minYear;
    nextBtn.disabled = state.calYear >= maxYear;
    resetBtn.style.visibility = state.donutMonths.size ? 'visible' : 'hidden';

    const monthNames = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
    grid.innerHTML = monthNames
      .map((name, i) => {
        const key = `${state.calYear}-${String(i + 1).padStart(2, '0')}`;
        const available = ALL_MONTHS.includes(key);
        const active = state.donutMonths.has(key);
        return `<button class="cal-month ${active ? 'active' : ''} ${available ? '' : 'cal-month--disabled'}" data-month="${key}" ${available ? '' : 'disabled'}>${name}</button>`;
      })
      .join('');

    grid.querySelectorAll('.cal-month').forEach((btn) =>
      btn.addEventListener('click', () => {
        const key = btn.dataset.month;
        if (state.donutMonths.has(key)) state.donutMonths.delete(key);
        else state.donutMonths.add(key);
        renderCalendar();
        if (currentModel) renderDonut(currentModel);
      })
    );
  }

  document.getElementById('calPrev').addEventListener('click', () => {
    state.calYear -= 1;
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    state.calYear += 1;
    renderCalendar();
  });
  document.getElementById('calReset').addEventListener('click', () => {
    state.donutMonths.clear();
    renderCalendar();
    if (currentModel) renderDonut(currentModel);
  });

  function renderAll() {
    const model = buildModel();
    currentModel = model;
    renderControls();
    renderStats(model);
    renderBarChart(model);
    renderCalendar();
    renderDonut(model);
  }

  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1QLyXHtkUfqfhnXDFmM02-tdirOXl67KcLg6l-I9yVYY/export?format=csv&gid=1778852585';

  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field);
        field = '';
      } else if (c === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else if (c === '\r') {
        // skip
      } else {
        field += c;
      }
    }
    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter((r) => r.length > 1 || r[0] !== '');
  }

  function monthKeyFromSheetDate(s) {
    const m = String(s).trim().match(/^(\d{2})\.(\d{2})\.(\d{4})/);
    return m ? `${m[3]}-${m[2]}` : null;
  }

  async function loadLiveData() {
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const table = parseCsv(text);
      if (!table.length) throw new Error('Leere Antwort');
      const header = table[0].map((h) => h.trim());
      const idx = {
        month: header.indexOf('application_month'),
        age: header.indexOf('age_group'),
        gender: header.indexOf('gender'),
        country: header.indexOf('country'),
        count: header.indexOf('active_creators'),
      };
      if (Object.values(idx).some((v) => v === -1)) throw new Error('Unerwartete Spalten im Sheet');

      const rows = table
        .slice(1)
        .map((r) => {
          const age = (r[idx.age] || '').trim();
          return {
            m: monthKeyFromSheetDate(r[idx.month]),
            a: age === '' || age === 'Unknown' ? 'Unbekannt' : age,
            g: (r[idx.gender] || '').trim() || 'Unbekannt',
            c: (r[idx.country] || '').trim() || 'Unbekannt',
            n: parseInt(r[idx.count], 10) || 0,
          };
        })
        .filter((r) => r.m);

      if (!rows.length) throw new Error('Keine Zeilen erhalten');
      return rows;
    } catch (err) {
      console.warn('Live-Daten konnten nicht geladen werden:', err);
      return null;
    }
  }

  async function init() {
    const sourcePill = document.getElementById('sourcePill');
    const updatedNote = document.getElementById('updatedNote');

    const live = await loadLiveData();
    if (live) {
      RAW = live;
      rebuildDerived();
      sourcePill.textContent = 'Live aus Google Sheet';
      updatedNote.textContent = 'Stand: ' + new Date().toLocaleString('de-DE');
    } else {
      sourcePill.textContent = 'Letzter bekannter Stand (offline)';
      updatedNote.textContent = 'Live-Daten aktuell nicht erreichbar \u2013 zeige gespeicherten Stand';
    }

    renderAll();
  }

  init();
</script>
